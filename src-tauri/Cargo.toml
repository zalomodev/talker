[package]
name = "talker"
version = "0.1.0"
description = "Real-time application audio transcription and translation overlay for Windows"
authors = ["zalomodev"]
license = "Apache-2.0"
repository = "https://github.com/zalomodev/talker"
edition = "2021"
default-run = "talker"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
flexaudio = "0.2.0"
candle-core = "0.11.0"
candle-transformers = "0.11.0"
candle-nn = "0.11.0"
tokenizers = "0.22.2"
keyring = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
async-trait = "0.1"
parking_lot = "0.12"
hound = "3.5"
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
sherpa-onnx = "1.13.8"
tar = "0.4.46"
bzip2 = "0.6.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.54", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_Graphics_Gdi",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
